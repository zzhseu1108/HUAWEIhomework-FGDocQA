name: Build submission executables

on:
  push:
    paths:
      - 'packaging/**'
      - 'src/**'
      - 'examples/**'
      - 'requirements.txt'
      - '.github/workflows/build-submission.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            architecture: x64
            target: windows-x64
            archive: zip
          - os: macos-15
            architecture: arm64
            target: macos-arm64
            archive: tar.gz
          - os: macos-15-intel
            architecture: x64
            target: macos-x64
            archive: tar.gz
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: ${{ matrix.architecture }}
      - name: Install build dependencies
        run: python -m pip install -r packaging/requirements-build.txt
      - name: Check the standalone launcher
        run: python packaging/launcher.py --smoke-test
      - name: Build the executable
        run: python packaging/build_app.py --dist-dir dist --work-dir build/pyinstaller
      - name: Verify the Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & .\dist\FGDocQA\FGDocQA.exe --smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify the macOS executable
        if: runner.os == 'macOS'
        run: ./dist/FGDocQA/FGDocQA --smoke-test
      - name: Upload the native application archive
        uses: actions/upload-artifact@v7
        with:
          name: FGDocQA-${{ matrix.target }}
          path: dist/FGDocQA-${{ matrix.target }}.${{ matrix.archive }}
          archive: false
          if-no-files-found: error
          retention-days: 30
